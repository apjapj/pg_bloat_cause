# .github/workflows/ci.yml: the checks a tag needs to have passed.
#
# Two jobs. lint needs no database. test runs ci/job.sh once per PostgreSQL version that has committed
# evidence (14 and 18): it builds the server image from the official one plus pgTAP, builds a primary
# and a hot standby for s3, runs pgTAP and every scenario, and requires the masked evidence to come out
# byte-identical to what is committed. Everything a job does is in ci/job.sh, so a failure here can be
# reproduced locally with the same command.
name: ci

on:
  push:
  pull_request:

# Least privilege, stated rather than inherited. These jobs check the repository out and
# read a database; none of them writes to the repository, creates a release, or needs a
# token wider than read access to the contents. Declaring it here means a later change
# cannot quietly widen it, and it matches what the secret scan workflows in this family
# already declare.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/lint.sh, not the checks one by one: three of the six were only in `make lint`, so
      # they never ran in CI. The script is the list.
      - name: every database-free check
        run: ./scripts/lint.sh
      - name: every script parses
        run: for s in scenarios/*.sh ci/*.sh scripts/*.sh; do bash -n "$s" || exit 1; done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every stable version in the supported range, not a sample of it. 14 and 18 were the whole
        # matrix until this, which meant 15, 16 and 17 were never run anywhere, while the README said
        # the "PG 14 to 19 matrix" was done. All three pass on this harness when run by hand; they now
        # run on every push. 19 is the current pre-release: its image needs the include form and a
        # separate apt major, the way pg_lock_tree does it. At GA, the tag becomes stable 19.
        include:
          - pg_version: "14"
            apt_version: "14"
          - pg_version: "15"
            apt_version: "15"
          - pg_version: "16"
            apt_version: "16"
          - pg_version: "17"
            apt_version: "17"
          - pg_version: "18"
            apt_version: "18"
          - pg_version: "19beta4"
            apt_version: "19"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: psql and pg_prove on the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client libtap-parser-sourcehandler-pgtap-perl
      - name: build the pair, install, pgTAP, scenarios, evidence
        # Strict: a difference in the masked evidence fails the job, like pgTAP and the scenario
        # assertions. See ci/README.md for why it started report-only and what the first run showed.
        run: ./ci/job.sh ${{ matrix.pg_version }} ${{ matrix.apt_version }}

  # One command, the same in both copies: check-defects.sh picks container mode here (Docker is on
  # this runner) and local mode on the Forgejo copy (its runner is a PostgreSQL and has no Docker).
  # scripts/check-ci-parity.sh holds the two to it.
  defects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make defects PG=18
