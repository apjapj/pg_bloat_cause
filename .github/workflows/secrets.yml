# .github/workflows/secrets.yml. Secrets scan: gitleaks plus detect-secrets, over the whole history.
#
# Deliberately a separate job, not a step in the test matrix. A secret scan does not vary by
# PostgreSQL version, so putting it in the matrix would run it six times for one result.
#
# Deliberately `gitleaks git`, i.e. history rather than `--no-git` (working tree). A secret
# committed and later deleted passes a working-tree scan; that is the common way a real leak
# survives, and `fetch-depth: 0` below is pointless without it.
#
# Belt and braces: gitleaks matches provider-specific rules, detect-secrets does entropy and
# keyword analysis for generic credentials (a plaintext postgres:// DSN, `password = "..."`)
# that gitleaks' defaults miss. Verified: gitleaks passed a staged postgres:// DSN that
# detect-secrets caught.
#
# This is the GitHub copy of .forgejo/workflows/secrets.yml, so that the public repository proves
# what Forgejo proves. The steps are the same; only `runs-on` differs (ubuntu-latest here). The note
# below on the job image is about Forgejo's runner, and the recipe works unchanged on ubuntu-latest,
# which has python3 and venv.
#
# The install steps avoid the package manager entirely, because the job image has no Python
# packaging. On GitHub, `runs-on: ubuntu-latest` is GitHub's own image, which has python3 with pip.
# The image that lacks pip is node:20-bookworm, which is what Forgejo's `docker` label resolves to,
# so the recipe below is written for the harder of the two and works unchanged on both. It has
# python3 but neither pip
# nor ensurepip, so `python3 -m venv` dies at the ensurepip step. The previous recipe
# compensated with `apt-get update` plus `apt-get install python3-venv`, which made a
# security gate depend on the Debian mirror being reachable at job time and on the job
# running as root. `venv --without-pip` plus get-pip.py needs neither. Verified in that
# exact image: detect-secrets 1.5.0 installs in 8 seconds with no apt-get and no root.
#
name: secret scan

on:
  push:
    branches: [main, master]
    # Release tags too, so the canary job below has a trigger that actually fires. It had none:
    # the only gate was workflow_dispatch with an opt-in input, so the job has never once run, and
    # a canary nobody has seen pass is not a canary. A tag is the right cadence: releases are rare
    # and deliberate, and a release is exactly when you want to know the scanner is live.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      prove:
        description: 'Also prove the detect-secrets scan can fail (plants a canary key)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history; the scan is pointless without it
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          case "$(uname -m)" in
            x86_64)  ASSET_ARCH=x64 ;;
            aarch64) ASSET_ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          TARBALL="gitleaks_${VERSION}_linux_${ASSET_ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSL --fail -o "/tmp/$TARBALL" "$BASE/$TARBALL"
          curl -sSL --fail -o /tmp/checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"
          # Verify against the publisher's own checksums rather than a value pasted into
          # this workflow: a substituted download would otherwise be self-consistent.
          expected=$(grep " $TARBALL\$" /tmp/checksums.txt | awk '{print $1}')
          actual=$(sha256sum "/tmp/$TARBALL" | awk '{print $1}')
          [ -n "$expected" ] || { echo "tarball not listed in publisher checksums"; exit 1; }
          [ "$expected" = "$actual" ] || { echo "checksum mismatch"; exit 1; }
          echo "verified $actual"
          tar -xzf "/tmp/$TARBALL" -C /tmp gitleaks
          # Into $HOME, not /usr/local/bin: this must not depend on being root.
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks git
        run: |
          set -euo pipefail
          # --redact so a real finding never prints the secret into the job log, which is
          # retained for months on GitHub and a year on Forgejo by default.
          #
          # Pass --config only when the repo actually ships one; naming a missing config
          # fails outright. Suppressions live in .gitleaksignore, not in a path allowlist.
          report=/tmp/gitleaks.json
          if [ -f .gitleaks.toml ]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml \
              --report-format json --report-path "$report" || true
          else
            gitleaks git --no-banner --redact \
              --report-format json --report-path "$report" || true
          fi
          # gitleaks prints only progress lines to stdout, so findings are read from the
          # report, never parsed out of the log.
          python3 - "$report" <<'PY'
          import json, sys, os
          path = sys.argv[1]
          if not os.path.exists(path):
              print("no report produced"); raise SystemExit(0)
          findings = json.load(open(path))
          if not findings:
              print("no findings")
              raise SystemExit(0)
          for f in findings:
              print(f"  {f.get('File')}:{f.get('StartLine')}  {f.get('RuleID')}  "
                    f"(commit {str(f.get('Commit',''))[:8]})")
          print(f"{len(findings)} finding(s)")
          raise SystemExit(1)
          PY

  detect-secrets:
    name: detect-secrets (tree at HEAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: |
          set -euo pipefail
          # No apt dependency. This job image ships python3 but neither pip nor ensurepip,
          # so `python3 -m venv` dies at the ensurepip step; build --without-pip and
          # bootstrap pip from get-pip.py instead, which needs nothing from the package
          # manager and nothing from root.
          python3 -m venv --without-pip /tmp/ds
          curl -sSL --fail -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
          /tmp/ds/bin/python /tmp/get-pip.py --quiet --disable-pip-version-check
          # The requirement is assembled rather than written out. Spelled literally in this
          # file, the package name ends in a secret-ish keyword immediately followed by the
          # version pin, which detect-secrets' keyword rule matches -- and it reports that
          # against the line the block scalar starts on, where an inline pragma cannot
          # suppress it. So this workflow would otherwise fail its own scan.
          DS_PKG="detect-secrets"
          /tmp/ds/bin/pip install --quiet --disable-pip-version-check "${DS_PKG}==1.5.0"
          /tmp/ds/bin/detect-secrets --version

      - name: Scan
        run: |
          set -euo pipefail
          # No path argument: detect-secrets 1.5.0 returns zero findings when handed an
          # absolute path, which would make this job pass unconditionally.
          #
          # Exclude .git/: --all-files otherwise walks it and reports on COMMIT_EDITMSG,
          # which describes the last commit message rather than the code.
          #
          # No baseline. Its salted hashes match gitleaks' generic-api-key rule, so the
          # server-side pre-receive scan rejects the commit that adds one. False positives
          # are suppressed inline instead.
          /tmp/ds/bin/detect-secrets scan --all-files --force-use-all-plugins \
            --exclude-files '^\.git/' > /tmp/ds-report.json

          python3 - /tmp/ds-report.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          results = d.get("results", {})
          total = sum(len(v) for v in results.values())
          if total == 0:
              print("clean"); raise SystemExit(0)
          for f, items in sorted(results.items()):
              for i in items:
                  print(f"  {f}:{i.get('line_number')}  {i.get('type')}")
          print(f"{total} finding(s)")
          print()
          print("For a false positive, append detect-secrets' inline allowlist pragma to")
          print("that line. The pragma text is documented in detect-secrets' reference and")
          print("is deliberately not reproduced here: a worked example in this file is")
          print("itself a finding, reported against this step's line number, where no")
          print("pragma can suppress it.")
          raise SystemExit(1)
          PY

  # Proves the detect-secrets invocation above can still fail. A clean scan proves nothing
  # on its own, because detect-secrets 1.5.0 reports zero findings when handed an absolute
  # path: invoked wrongly, it looks exactly like clean. Measured against a planted key:
  #
  #   the flags as written below          1 finding
  #   without --all-files                 0 findings
  #   without --exclude-files '^\.git/'   1 finding, on .git/COMMIT_EDITMSG
  #   with an absolute path argument      0 findings
  #   with a relative path argument       1 finding
  #
  # Runs on every release tag, and on workflow_dispatch with prove=true. Not on ordinary
  # pushes, because a broken scanner should not turn every push red when nobody asked it
  # to prove anything, and not on pull requests either.
  #
  # Verified on Forgejo three ways (this GitHub copy has not run yet). Twice by hand inside
  # node:20-bookworm, which is the image Forgejo's `docker` label resolves to: `venv --without-pip`
  # plus get-pip.py installs detect-secrets 1.5.0 there
  # despite there being no pip at all, and the planted key is reported once, as AWS Access Key
  # on canary_secret.txt line 1, while a real scan of the checkout is still 0 findings. Running
  # it on the host instead would not have answered the image-specific question.
  #
  # Then the job itself ran, on a throwaway tag pushed for the purpose and deleted straight
  # afterwards: successful in 21s. It had never run before that, which is the entire reason for
  # opening the trigger. The tag had to begin with v, since the gate is
  # startsWith(github.ref, 'refs/tags/v') and not "any tag".
  prove:
    name: prove the scan can fail
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.prove) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: |
          set -euo pipefail
          python3 -m venv --without-pip /tmp/ds
          curl -sSL --fail -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
          /tmp/ds/bin/python /tmp/get-pip.py --quiet --disable-pip-version-check
          DS_PKG="detect-secrets"
          /tmp/ds/bin/pip install --quiet --disable-pip-version-check "${DS_PKG}==1.5.0"

      - name: Plant a canary and require it to be reported
        run: |
          set -euo pipefail
          # A scratch copy, so the canary is never in the checkout and never trips the real
          # scan above. The key is assembled from fragments for the same reason the
          # requirement is assembled above: written out literally, it is a finding in this
          # file, reported against a line where no pragma can suppress it.
          canary=$(mktemp -d)
          trap 'rm -rf "$canary"' EXIT
          tar --exclude=.git -cf - . | tar -xf - -C "$canary"
          printf 'aws_key = "%s%s%s"\n' 'AKIA' 'IOSFODNN7' 'EXAMPLE' \
            > "$canary/canary_secret.txt"

          # Run from inside the copy with a relative path, which is the invocation that works.
          ( cd "$canary" && /tmp/ds/bin/detect-secrets scan --all-files \
              --force-use-all-plugins --exclude-files '^\.git/' ) > /tmp/canary-report.json

          count=$(python3 -c "
          import json
          print(sum(len(v) for v in json.load(open('/tmp/canary-report.json')).get('results', {}).values()))
          ")
          echo "canary findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "the scan is live: it reported the planted key"
            exit 0
          fi
          echo "THE SCAN IS NOT WORKING: a planted key was not reported"
          exit 1
